<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Metallic Gold Outer Border Gradient -->
    <linearGradient id="goldOuterBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE885" />
      <stop offset="25%" stop-color="#F2B82E" />
      <stop offset="50%" stop-color="#8F590A" />
      <stop offset="75%" stop-color="#FCD353" />
      <stop offset="100%" stop-color="#C58914" />
    </linearGradient>

    <!-- Metallic Gold Inner Rim -->
    <linearGradient id="goldInnerRim" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7A4B06" />
      <stop offset="40%" stop-color="#EBB330" />
      <stop offset="70%" stop-color="#FFF2A8" />
      <stop offset="100%" stop-color="#8F590A" />
    </linearGradient>

    <!-- Deep Matte Dark Background with subtle ambient warm glow -->
    <radialGradient id="darkBg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#1A1B20" />
      <stop offset="45%" stop-color="#0F1013" />
      <stop offset="100%" stop-color="#050506" />
    </radialGradient>

    <!-- 3D Bevel Top / Light Facets -->
    <linearGradient id="bevelLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFDE0" />
      <stop offset="60%" stop-color="#F8CF58" />
      <stop offset="100%" stop-color="#DC9F1A" />
    </linearGradient>

    <!-- 3D Bevel Left Facets -->
    <linearGradient id="bevelLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFF5B8" />
      <stop offset="100%" stop-color="#D4991A" />
    </linearGradient>

    <!-- 3D Bevel Right / Dark Facets -->
    <linearGradient id="bevelRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A56A0D" />
      <stop offset="100%" stop-color="#5E3A02" />
    </linearGradient>

    <!-- 3D Bevel Bottom Dark Facets -->
    <linearGradient id="bevelDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#915B0A" />
      <stop offset="100%" stop-color="#462900" />
    </linearGradient>

    <!-- Main Front Face Satin Gold -->
    <linearGradient id="hFrontFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE680" />
      <stop offset="18%" stop-color="#F3C33D" />
      <stop offset="48%" stop-color="#E4A824" />
      <stop offset="52%" stop-color="#F5D058" />
      <stop offset="85%" stop-color="#CE8F14" />
      <stop offset="100%" stop-color="#B07507" />
    </linearGradient>

    <!-- Soft Drop Shadow Filter for 3D depth -->
    <filter id="hShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.85" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <filter id="goldGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#E2A61B" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Outer Rounded Square Container -->
  <!-- Outer Gold Rim -->
  <rect x="24" y="24" width="464" height="464" rx="104" ry="104" fill="url(#darkBg)" stroke="url(#goldOuterBorder)" stroke-width="12" filter="url(#goldGlow)" />

  <!-- Inner Dark Recess Gap -->
  <rect x="36" y="36" width="440" height="440" rx="92" ry="92" fill="none" stroke="#060607" stroke-width="4" />

  <!-- Inner Fine Gold Rim -->
  <rect x="40" y="40" width="432" height="432" rx="88" ry="88" fill="none" stroke="url(#goldInnerRim)" stroke-width="2.5" opacity="0.8" />

  <!-- Center Metallic 3D Letter "H" with Cast Shadow -->
  <g filter="url(#hShadow)">
    <!-- Base / Outer Bevel Shape of H -->
    <!-- Outer H bounds: Left 120, Right 392, Top 110, Bottom 402 -->
    <!-- Left Stem: 120 to 205 -->
    <!-- Right Stem: 307 to 392 -->
    <!-- Crossbar: 226 to 286 -->

    <!-- OUTER BEVEL FACETS -->
    <!-- Top Bevels (Light) -->
    <!-- Left stem top -->
    <polygon points="120,110 205,110 193,124 132,124" fill="url(#bevelLight)" />
    <!-- Right stem top -->
    <polygon points="307,110 392,110 380,124 319,124" fill="url(#bevelLight)" />
    <!-- Crossbar top -->
    <polygon points="205,226 307,226 297,238 215,238" fill="url(#bevelLight)" />

    <!-- Left Bevels (Light / Sheen) -->
    <!-- Left stem outer left -->
    <polygon points="120,110 132,124 132,388 120,402" fill="url(#bevelLeft)" />
    <!-- Right stem inner left (in upper cutout) -->
    <polygon points="307,110 319,124 319,226 307,226" fill="url(#bevelLeft)" />
    <!-- Right stem inner left (in lower cutout) -->
    <polygon points="307,286 319,286 319,388 307,402" fill="url(#bevelLeft)" />

    <!-- Right Bevels (Shaded / Darker) -->
    <!-- Right stem outer right -->
    <polygon points="392,110 392,402 380,388 380,124" fill="url(#bevelRight)" />
    <!-- Left stem inner right (in upper cutout) -->
    <polygon points="205,110 205,226 193,226 193,124" fill="url(#bevelRight)" />
    <!-- Left stem inner right (in lower cutout) -->
    <polygon points="205,286 205,402 193,388 193,286" fill="url(#bevelRight)" />

    <!-- Bottom Bevels (Dark / Shadow) -->
    <!-- Left stem bottom -->
    <polygon points="120,402 132,388 193,388 205,402" fill="url(#bevelDark)" />
    <!-- Right stem bottom -->
    <polygon points="307,402 319,388 380,388 392,402" fill="url(#bevelDark)" />
    <!-- Crossbar bottom -->
    <polygon points="205,286 215,274 297,274 307,286" fill="url(#bevelDark)" />

    <!-- MAIN FRONT FACE OF LETTER H -->
    <path d="
      M 132,124
      L 193,124
      L 193,238
      L 319,238
      L 319,124
      L 380,124
      L 380,388
      L 319,388
      L 319,274
      L 193,274
      L 193,388
      L 132,388
      Z
    " fill="url(#hFrontFace)" stroke="#F8DB70" stroke-width="1.2" stroke-linejoin="round" />

    <!-- Inner Chamfer Highlight Lines (Glints) -->
    <!-- Crisp top-edge highlights -->
    <line x1="133" y1="124" x2="192" y2="124" stroke="#FFFEE5" stroke-width="1.8" stroke-linecap="round" opacity="0.9" />
    <line x1="320" y1="124" x2="379" y2="124" stroke="#FFFEE5" stroke-width="1.8" stroke-linecap="round" opacity="0.9" />
    <line x1="193" y1="238" x2="319" y2="238" stroke="#FFFEE5" stroke-width="1.8" stroke-linecap="round" opacity="0.85" />

    <!-- Crisp left-edge specular highlights -->
    <line x1="132" y1="124" x2="132" y2="388" stroke="#FFF5B8" stroke-width="1.4" opacity="0.7" />
    <line x1="319" y1="124" x2="319" y2="238" stroke="#FFF5B8" stroke-width="1.2" opacity="0.6" />
    <line x1="319" y1="274" x2="319" y2="388" stroke="#FFF5B8" stroke-width="1.2" opacity="0.6" />

    <!-- Corner Chamfer Facet Connectors -->
    <!-- Top-left outer corner -->
    <line x1="120" y1="110" x2="132" y2="124" stroke="#FFFDE0" stroke-width="1.5" />
    <!-- Top-right outer corner -->
    <line x1="392" y1="110" x2="380" y2="124" stroke="#FDE27D" stroke-width="1.5" />
    <!-- Bottom-left outer corner -->
    <line x1="120" y1="402" x2="132" y2="388" stroke="#A86E0E" stroke-width="1.2" />
    <!-- Bottom-right outer corner -->
    <line x1="392" y1="402" x2="380" y2="388" stroke="#5E3A02" stroke-width="1.2" />

    <!-- Upper cutout interior corners -->
    <line x1="205" y1="110" x2="193" y2="124" stroke="#FDE27D" stroke-width="1.2" />
    <line x1="307" y1="110" x2="319" y2="124" stroke="#FFFDE0" stroke-width="1.2" />
    <line x1="205" y1="226" x2="193" y2="238" stroke="#D19818" stroke-width="1.2" />
    <line x1="307" y1="226" x2="319" y2="238" stroke="#D19818" stroke-width="1.2" />

    <!-- Lower cutout interior corners -->
    <line x1="205" y1="286" x2="193" y2="274" stroke="#7A4D05" stroke-width="1.2" />
    <line x1="307" y1="286" x2="319" y2="274" stroke="#7A4D05" stroke-width="1.2" />
    <line x1="205" y1="402" x2="193" y2="388" stroke="#7A4D05" stroke-width="1.2" />
    <line x1="307" y1="402" x2="319" y2="388" stroke="#7A4D05" stroke-width="1.2" />
  </g>
</svg>
